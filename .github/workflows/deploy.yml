name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.sponsors.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Sync public sponsors and Profile README
        run: npm run sync:sponsors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for sponsor changes
        id: sponsors
        run: |
          changed=false
          if ! git diff --quiet -- README.md src/data/sponsors.json; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != schedule || "$changed" == true ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.sponsors.outputs.deploy == 'true'
        run: npm ci
      - name: Check and build
        if: steps.sponsors.outputs.deploy == 'true'
        run: npm run sync:projects && npm run verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASTRO_TELEMETRY_DISABLED: 1
      - name: Save sponsor changes
        if: steps.sponsors.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src/data/sponsors.json
          git commit -m 'chore(sponsors): sync public sponsors'
          git push origin HEAD:main
      - name: Upload site
        if: steps.sponsors.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
